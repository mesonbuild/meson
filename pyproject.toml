[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.ruff]
  line-length = 100
  target-version = "py310"

  [tool.ruff.lint]
    select = ["E", "F", "I", "PLE", "PLW", "UP"]

    exclude = [
      "test cases/**",
    ]

    ignore = [
      "E501",     # line-too-long. Worth fixing. Also, there's like 4000 violations
      "E741",     # Ambiguous variable. Might be worth fixing, but doesn't like one letter variables in short loops
      "PLW0603",  # Global. We should stop using global, but we're already ignoring it
      "PLW1641",  # Lots of objects don't have hash methods, this is a weird error
      "PLW2901",  # for loop overwriting variable. Has a ton of false positives from a loop replace default values
    ]

name: int
long_name: Integer
description: All integer numbers. See [Numbers](Syntax.md#numbers) for more information.

methods:
- name: is_even
  returns: bool
  description: Returns true if the number is even.

- name: is_odd
  returns: bool
  description: Returns true if the number is odd

- name: to_string
  returns: str
  description: Returns the value of the number as a string.
  example: |
    ```meson
    assert(255.to_string(format: 'dec') == '255')
    assert(255.to_string(format: 'hex') == '0xff')
    assert(255.to_string(format: 'oct') == '0o377')
    assert(255.to_string(format: 'bin') == '0b11111111')
    ```

  optargs:
    fill:
      type: int
      description: |
        Left fill the string with zeros until it reaches the length
        specified by this argument. A leading negative sign counts towards
        the length, and is handled by inserting the padding after the `-`
        character rather than before. The original string is returned if the
        value provided is less than or equal to the former's length.
  kwargs:
    format:
      type: str
      since: 1.12.0
      default: "'dec'"
      description: |
        How to format the number; can be one of 'dec' (decimal), 'hex'
        (hexadecimal), 'oct' (octal), or 'bin' (binary).
        For formats other than 'dec', the string will be appropriately prefixed
        (e.g., for 'hex', the string will begin with '0x', etc.)

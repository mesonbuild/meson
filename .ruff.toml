line-length = 100
target-version = "py310"

[lint]
  select = ["F", "PERF", "UP008", "UP015", "UP018", "UP021", "UP022", "UP024", "UP031", "UP033", "UP034", "UP035", "UP039"]
  ignore = [
    "PERF203",  # This is is a good idea, but a significant amount of work.
  ]

[lint.per-file-ignores]
  "mesonbuild/mesonlib.py" = ["F403"]

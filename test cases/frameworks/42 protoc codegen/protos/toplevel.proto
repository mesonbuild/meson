syntax = "proto3";

// Imports are relative to the root of the generate() call that compiles the
// imported file.
import "nested/nested.proto";
import "configured.proto";
import "imported.proto";
import "generated/imported_generated.proto";
import "import_dir.proto";
// Generated by custom_target(): toplevel.proto must not be compiled before
// they exist.
import "custom.proto";
import "generated/multi_b.proto";

message TopLevel {
  Nested nested = 1;
  Configured configured = 2;
  Imported imported = 3;
  ImportedGenerated imported_generated = 4;
  ImportDir import_dir = 5;
  Custom custom = 6;
  MultiB multi_b = 7;
}
